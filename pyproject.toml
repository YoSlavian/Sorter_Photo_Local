[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmn-architect"
version = "1.0.0"
description = "Automatic BPMN 2.0 diagram synthesis from a natural-language business process description."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BPMN Architect contributors" }]
keywords = ["bpmn", "bpmn2", "process-mining", "diagram", "layout", "nlp", "camunda"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
bpmn-architect = "bpmn_architect.cli:main"

[project.urls]
Homepage = "https://github.com/YoSlavian/Sorter_Photo_Local"
Issues = "https://github.com/YoSlavian/Sorter_Photo_Local/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpmn_architect = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
