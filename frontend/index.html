<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BPMN Architect Studio — построение BPMN 2.0 диаграмм из текстового описания процесса" />
    <title>BPMN Architect Studio</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('bpmn-architect.theme');
        const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = stored || system;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
