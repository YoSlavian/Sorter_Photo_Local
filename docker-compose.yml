# Production: one container, one origin, one URL.
#   docker compose up            -> http://localhost:8000
#
# Development: the Vite dev server with hot reload in front of the API.
#   docker compose --profile dev up   -> http://localhost:3000 (API on :8000)

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: bpmn-architect-studio:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Deterministic mode needs nothing; these only enable the AI modes.
      BPMN_ARCHITECT_LLM_PROVIDER: "${BPMN_ARCHITECT_LLM_PROVIDER:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      BPMN_ARCHITECT_LLM_MODEL: "${BPMN_ARCHITECT_LLM_MODEL:-}"
      BPMN_ARCHITECT_LLM_BASE_URL: "${BPMN_ARCHITECT_LLM_BASE_URL:-}"
    restart: unless-stopped

  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: bpmn-architect-api:dev
    command:
      ["python", "-m", "uvicorn", "bpmn_architect.server.app:app",
       "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false

  web:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite proxies /api to the backend container instead of localhost.
      VITE_API_PROXY: http://api:8000
    depends_on:
      - api
